<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setoran Orderan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            background-image: radial-gradient(circle at top right, #1a1a1a, #0a0a0a);
        }
        .grad-gold {
            background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.1);
        }
        input, select, textarea {
            background-color: #1a1a1a !important;
            border: 1px solid #333 !important;
            color: white !important;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #d4af37 !important;
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: black;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .item-list-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold grad-gold mb-2">SETORAN ORDERAN</h1>
            <p class="text-gray-400 italic">• RealtimeLer48</p>
            <div class="h-1 w-24 bg-[#d4af37] mx-auto mt-4 rounded-full"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Form Section -->
            <section class="bg-[#111] p-6 rounded-2xl border border-[#222] card-shadow">
                <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    <span class="text-[#d4af37]">✦</span> Detail Pesanan
                </h2>

                <div class="space-y-4">
                    <!-- Pilihan Show -->
                    <div>
                        <label class="block text-sm font-medium mb-1 text-gray-300">Pilih Show</label>
                        <select id="showSelect" class="w-full p-3 rounded-lg">
                            <option value="">-- Pilih Show --</option>
                            <option value="Cara Meminum Ramune">Cara Meminum Ramune</option>
                            <option value="Pertaruhan Cinta">Pertaruhan Cinta</option>
                            <option value="Te Wo Tsunaginagara">Te Wo Tsunaginagara</option>
                            <option value="Pajama Drive">Pajama Drive</option>
                        </select>
                    </div>

                    <!-- Alternatif Show -->
                    <div>
                        <label class="block text-sm font-medium mb-1 text-gray-300">Atau Tulis Nama Show (Alternatif)</label>
                        <input type="text" id="showAlt" placeholder="Contoh: RKJ" class="w-full p-3 rounded-lg">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Tanggal -->
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-300">Tanggal (Saja)</label>
                            <input type="number" id="showDate" min="1" max="31" placeholder="Cth: 15" class="w-full p-3 rounded-lg">
                        </div>
                        <!-- Jumlah -->
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-300">Jumlah Tiket</label>
                            <input type="number" id="showQty" min="1" value="1" class="w-full p-3 rounded-lg">
                        </div>
                    </div>

                    <!-- Kriteria Show -->
                    <div>
                        <label class="block text-sm font-medium mb-1 text-gray-300">Kriteria Show & Harga</label>
                        <select id="showType" class="w-full p-3 rounded-lg">
                            <option value="5000" data-label="Show Reguler">Show Reguler (Rp 5.000)</option>
                            <option value="6000" data-label="Show STS/Spesial">Show STS / Spesial (Rp 6.000)</option>
                            <option value="8000" data-label="Show Khusus">Show Khusus (Rp 8.000)</option>
                            <option value="10000" data-label="Show Aniv">Show Aniv (Rp 10.000)</option>
                        </select>
                    </div>

                    <button onclick="addToOrder()" class="w-full btn-primary p-3 rounded-lg mt-4 shadow-lg shadow-yellow-900/20">
                        TAMBAHKAN KE DAFTAR
                    </button>
                </div>
            </section>

            <!-- Result Section -->
            <section class="bg-[#111] p-6 rounded-2xl border border-[#222] card-shadow flex flex-col">
                <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    <span class="text-[#d4af37]">✦</span> Daftar Orderan Saya
                </h2>

                <div id="orderList" class="flex-grow space-y-3 mb-6 overflow-y-auto max-h-[300px] pr-2">
                    <!-- Dinamis -->
                    <p class="text-gray-500 text-center italic mt-10">Belum ada orderan ditambahkan.</p>
                </div>

                <div class="border-t border-[#333] pt-4 mt-auto">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-gray-400">Total Nominal:</span>
                        <span id="totalPrice" class="text-2xl font-bold text-[#d4af37]">Rp 0</span>
                    </div>
                    
                    <button onclick="sendToWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.246 2.248 3.484 5.232 3.484 8.412-.003 6.557-5.338 11.892-11.893 11.892-1.997-.001-3.951-.5-5.688-1.448l-6.309 1.656zm6.224-3.82l.303.18c1.397.831 3.013 1.27 4.673 1.271 4.933 0 8.947-4.014 8.949-8.948 0-2.398-.934-4.653-2.63-6.348-1.697-1.696-3.951-2.63-6.35-2.63-4.933 0-8.947 4.014-8.949 8.95 0 1.838.563 3.634 1.628 5.188l.205.3-.996 3.637 3.719-.975zm11.367-7.405c-.131-.219-.485-.35-.788-.503-.303-.153-1.791-.884-2.069-.984-.278-.1-.481-.153-.685.153-.204.306-.791.984-.969 1.188-.178.204-.356.23-.659.077-.303-.153-1.28-.472-2.439-1.503-.9-.802-1.507-1.794-1.684-2.1-.178-.306-.019-.471.132-.622.136-.136.303-.35.455-.526.152-.175.202-.301.303-.503.101-.202.051-.377-.025-.53-.076-.153-.685-1.653-.938-2.263-.247-.593-.498-.512-.685-.522-.176-.01-.378-.011-.58-.011-.202 0-.531.076-.809.376-.278.301-1.062 1.037-1.062 2.532 0 1.496 1.087 2.94 1.239 3.144.152.204 2.14 3.268 5.183 4.579.725.311 1.29.497 1.731.637.728.231 1.39.199 1.913.121.583-.088 1.791-.733 2.044-1.442.253-.708.253-1.314.177-1.442z"/></svg>
                        KIRIM KE GROUP WHATSAPP
                    </button>
                    <p class="text-[10px] text-gray-500 text-center mt-2">Tag: +62 888-0904-8431 | Group: RealtimeLer48</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-yellow-600 text-black px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none font-bold">
        Show berhasil ditambahkan!
    </div>

    <script>
        let orders = [];

        function addToOrder() {
            const showSelect = document.getElementById('showSelect').value;
            const showAlt = document.getElementById('showAlt').value;
            const date = document.getElementById('showDate').value;
            const qty = parseInt(document.getElementById('showQty').value);
            const typeSelect = document.getElementById('showType');
            const pricePerShow = parseInt(typeSelect.value);
            const typeLabel = typeSelect.options[typeSelect.selectedIndex].getAttribute('data-label');

            const showName = showAlt || showSelect;

            if (!showName || !date || isNaN(qty) || qty < 1) {
                showToast("Harap isi Nama Show, Tanggal, dan Jumlah!");
                return;
            }

            orders.push({
                name: showName,
                date: date,
                qty: qty,
                price: pricePerShow * qty,
                type: typeLabel
            });

            // Reset inputs
            document.getElementById('showDate').value = '';
            document.getElementById('showQty').value = '1';
            document.getElementById('showAlt').value = '';
            
            updateOrderList();
            showToast("Orderan ditambahkan!");
        }

        function updateOrderList() {
            const container = document.getElementById('orderList');
            const totalDisplay = document.getElementById('totalPrice');
            
            if (orders.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center italic mt-10">Belum ada orderan ditambahkan.</p>';
                totalDisplay.innerText = 'Rp 0';
                return;
            }

            // Urutkan berdasarkan Nama, lalu Tanggal
            orders.sort((a, b) => a.name.localeCompare(b.name) || parseInt(a.date) - parseInt(b.date));

            let html = '';
            let total = 0;

            orders.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="flex justify-between items-center bg-[#1a1a1a] p-3 rounded-lg border-l-4 border-[#d4af37] item-list-enter">
                        <div>
                            <div class="font-bold text-[#d4af37]">${item.name}</div>
                            <div class="text-xs text-gray-400">Tgl: ${item.date} | Qty: ${item.qty} | ${item.type}</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-semibold">Rp ${item.price.toLocaleString()}</span>
                            <button onclick="removeOrder(${index})" class="text-red-500 hover:text-red-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalDisplay.innerText = `Rp ${total.toLocaleString()}`;
        }

        function removeOrder(index) {
            orders.splice(index, 1);
            updateOrderList();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function formatMessage() {
            if (orders.length === 0) return null;

            // Grouping logic: Jika nama sama, kirim 1 nama dengan beberapa tanggal
            const grouped = {};
            orders.forEach(item => {
                if (!grouped[item.name]) {
                    grouped[item.name] = { dates: [], totalQty: 0, totalPrice: 0, types: new Set() };
                }
                grouped[item.name].dates.push(item.date);
                grouped[item.name].totalQty += item.qty;
                grouped[item.name].totalPrice += item.price;
                grouped[item.name].types.add(item.type);
            });

            let text = `*SETORAN ORDERAN SHOW*\n`;
            text += `*RealtimeLer48*\n`;
            text += `------------------------------------\n\n`;

            let grandTotal = 0;
            for (const name in grouped) {
                const data = grouped[name];
                const typesStr = Array.from(data.types).join(", ");
                text += `Show: *${name}*\n`;
                text += `Tanggal: ${data.dates.join(", ")}\n`;
                text += `Total Qty: ${data.totalQty}\n`;
                text += `Kriteria: ${typesStr}\n`;
                text += `Subtotal: Rp ${data.totalPrice.toLocaleString()}\n`;
                text += `------------------------------------\n`;
                grandTotal += data.totalPrice;
            }

            text += `\n*TOTAL KESELURUHAN: Rp ${grandTotal.toLocaleString()}*\n\n`;
            text += `cc: @6288809048431\n`;
            text += `_Konfirmasi otomatis via website_`;

            return encodeURIComponent(text);
        }

        function sendToWhatsApp() {
            const message = formatMessage();
            if (!message) {
                showToast("Daftar orderan masih kosong!");
                return;
            }
            
            // Menggunakan tautan grup dan menambahkan pesan (catatan: chat.whatsapp.com biasanya tidak mendukung parameter text secara langsung, 
            // namun format ini akan menyalin teks ke clipboard atau membuka WA dengan teks di beberapa platform/browser)
            // Sebagai solusi terbaik, kita arahkan ke API WA dengan menyertakan tag nomor.
            
            const groupLink = "https://chat.whatsapp.com/LWuZRg24VnZIrNBEYmcsUX";
            const waUrl = `https://api.whatsapp.com/send?text=${message}`;
            
            // Berikan pilihan atau otomatis buka salah satu
            // Karena link group tidak bisa dipasangi teks otomatis di linknya, kita buka pengiriman pesan personal/group search
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
